name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
  # Weekly early warning for dependency advisories, so a new one is found out
  # of band rather than by failing an unrelated PR.
  schedule:
    - cron: "17 6 * * 1"

# Least privilege by default; each job requests only what it needs.
permissions: {}

jobs:
  # The three shell scripts are the highest-privilege code in the repo
  # (curl | sudo bash, as root, on other people's machines) and had no
  # automated verification at all. Runs as its own job so it reports in
  # seconds, without waiting for a pnpm install.
  shell-scripts:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Syntax check
        shell: bash
        run: |
          for script in install.sh uninstall.sh migrate-install-defaults.sh; do
            echo "bash -n $script"
            bash -n "$script"
          done

      # shellcheck is preinstalled on the GitHub-hosted Ubuntu images.
      # --severity=warning to start with; tighten to the default (style) once
      # the informational findings have been worked through.
      - name: ShellCheck
        shell: bash
        run: |
          shellcheck --version
          shellcheck --severity=warning --shell=bash \
            install.sh uninstall.sh migrate-install-defaults.sh

      # install.sh and migrate-install-defaults.sh carry duplicate unit
      # templates, and comments alone were not keeping them in sync.
      - name: Check systemd unit templates are in sync
        run: bash scripts/check-unit-template-sync.sh

      # 0.4.4 shipped a unit that started cleanly and then failed every write
      # under /home, because ReadWritePaths= does not override ProtectHome=.
      # Nothing in bash -n, shellcheck or a unit parser catches that.
      - name: Check systemd unit hardening is self-consistent
        run: bash scripts/check-unit-hardening.sh

      # Same problem for the override maps in package.json and
      # pnpm-workspace.yaml. Node is preinstalled on the runner image and this
      # script has no dependencies, so it needs no pnpm install.
      - name: Check dependency overrides are in sync
        run: node scripts/check-overrides-sync.mjs

  quality-and-tests:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      # Regression guard for the dependency overrides in package.json /
      # pnpm-workspace.yaml: if an override stops matching, the advisory it was
      # suppressing comes back and this fails.
      #
      # Gated at `high` so a newly published low or moderate advisory against
      # some transitive dependency cannot turn main red on an unrelated PR with
      # no code change. The scheduled run below catches the rest, out of band.
      - name: Audit dependencies
        run: pnpm audit --audit-level=high

      # Weekly run only: fails on any advisory at any level, so a moderate is
      # noticed and triaged before it ever escalates to high and blocks a PR.
      - name: Audit dependencies (all levels)
        if: github.event_name == 'schedule'
        run: pnpm audit

      # Scoped rather than repo-wide: `pnpm format:check` currently reports 77
      # pre-existing files under packages/ and packages/server/templates/.
      # Widen this to `pnpm format:check` once those have been reformatted.
      # Only extensions `pnpm format` can repair are checked, so a failure here
      # always has a command that fixes it.
      - name: Format check
        run: pnpm format:check:scoped

      - name: Typecheck
        run: pnpm typecheck

      - name: Run all server tests
        run: pnpm --filter @deckos/server test

      - name: Run all client tests
        run: pnpm --filter @deckos/client test

      - name: Build
        run: pnpm build

  server-coverage:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate server coverage
        run: pnpm --filter @deckos/server test:coverage

      - name: Upload server coverage artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: server-coverage
          path: packages/server/coverage

  client-coverage:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate client coverage
        run: pnpm --filter @deckos/client test:coverage

      - name: Upload client coverage artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: client-coverage
          path: packages/client/coverage
