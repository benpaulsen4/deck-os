# Dependency overrides live here and nowhere else.
#
# They were previously declared twice, because pnpm 9 read them only from
# package.json `pnpm.overrides` and pnpm 10+ reads them only from here. The
# `packageManager` pin is now pnpm 11, so the package.json copy is gone along
# with the script that kept the two in sync.
#
# `pnpm audit` in CI is the backstop: if an override stops applying, the
# advisory it suppresses comes back and the build fails.
packages:
  - "packages/*"

# pnpm 10 stopped running dependency lifecycle scripts by default; pnpm 11
# then removed onlyBuiltDependencies / onlyBuiltDependenciesFile /
# neverBuiltDependencies / ignoredBuiltDependencies / ignoreDepScripts
# entirely, replacing all of them with this single map. Every package with a
# build script needs an explicit yes/no here or install refuses to proceed at
# all. Decided per package by checking what the script actually does:
#   esbuild        true  - postinstall fetches the platform binary. Without
#                           approval here, vite and vitest fail at run time
#                           with a missing-binary error that does not look
#                           like a dependency problem.
#   cpu-features   false - optional native accel for ssh2's crypto; its own
#                           install script is non-fatal on failure, and it
#                           does not build cleanly against current Node/MSVC
#                           headers in this environment.
#   ssh2           false - optional native crypto binding; install.js logs
#                           and exits 0 on build failure, falling back to the
#                           pure-JS implementation either way.
#   msw            false - postinstall only acts when package.json declares
#                           `msw.workerDirectory`, which this repo does not;
#                           tests use msw/node (setupServer), not the browser
#                           worker.
#   protobufjs     false - postinstall only prints a version-scheme warning;
#                           no build output depends on it.
allowBuilds:
  cpu-features: false
  esbuild: true
  msw: false
  protobufjs: false
  ssh2: false

overrides:
  "@protobufjs/utf8@<=1.1.0": ">=1.1.1"
  "@babel/core": "^7.29.7"
  "@grpc/grpc-js": "^1.14.4"
  "dockerode>@grpc/grpc-js": "^1.14.4"
  "brace-expansion@>=3.0.0 <5.0.9": "^5.0.9"
  "test-exclude>glob": "^11.0.0"
  "flatted": "^3.4.2"
  "follow-redirects": "^1.16.0"
  "hono": "^4.12.34"
  "nanoid": ">=3.3.18"
  "postcss": ">=8.5.18"
  "shell-quote": ">=1.9.0"
  "undici": "^7.29.0"
  "dockerode>protobufjs": "^7.6.5"
  "@grpc/proto-loader>protobufjs": "^7.6.5"
